<!DOCTYPE html><html lang="en" data-theme="navy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>DLP Operations Platform</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="bg"></canvas>
<div id="login" class="loginwrap hide"><div class="panel loginbox"><div class="logo">🛡️ DLP <span style="color:var(--ac)">Operations</span> Platform</div><div class="note">Authorised users only. All sign-in attempts and actions are audited.</div>
<input id="lu" placeholder="Username" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password"><div id="le" class="err"></div><button class="btn pri" id="lb">Sign in</button></div></div>
<div id="app" class="app hide"><aside><div class="brand">🛡️ DLP <b>Ops</b></div><nav id="nav"></nav><div class="foot"><div id="who" class="note"></div><button class="btn sm" id="th">Theme</button><button class="btn sm" id="cp">Change password</button><button class="btn sm" id="lo">Sign out</button></div></aside><main id="view"></main></div>
<div id="toasts"></div><script src="bg.js"></script><script src="app.js"></script></body></html>
