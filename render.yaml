
services:
  - type: web
    name: dlp-platform
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 --bind 0.0.0.0:$PORT --access-logformat '%(h)s "%(m)s %(U)s" %(s)s' wsgi:app
    envVars:
      - key: DLP_ENV
        value: production
      - key: DB_PATH
        value: /var/data/dlp.db
      - key: DLP_INITIAL_ADMIN_PASSWORD
        sync: false
    disk:
      name: dlp-data
      mountPath: /var/data
      sizeGB: 1
